[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tars-local"
version = "0.1.0"
description = "Asistente local estilo TARS para hablar con tus robots, sin internet"
requires-python = ">=3.11"
dependencies = []  # el núcleo (chat por texto + robots simulados) solo usa la biblioteca estándar

[project.optional-dependencies]
voz = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.24", "piper-tts>=1.2"]
robots = ["pyserial>=3.5", "paho-mqtt>=1.6"]

[project.scripts]
tars = "tars.cli:main"

[tool.setuptools]
packages = ["tars"]
